<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hi Ryah</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      background: #0f1115;
      color: #f4f4f5;
    }
    body {
      display: grid;
      place-items: center;
    }
    main {
      text-align: center;
    }
    h1 {
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 600;
      letter-spacing: -0.04em;
      margin: 0 0 1.5rem;
    }
    a.button {
      display: inline-block;
      padding: 0.85rem 1.6rem;
      background: #f4f4f5;
      color: #0f1115;
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 999px;
    }
    a.button:hover {
      background: #d4d4d8;
    }
  </style>
</head>
<body>
  <main>
    <h1>hi ryah!</h1>
